<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
  <title id="title">Sesiones por campaña de sesión, 30 de septiembre de 2026</title>
  <desc id="desc">Gráfico horizontal con los valores de sesiones que muestra cada fila del informe de GA4. Las ocho filas suman 26 sesiones aunque el total del informe muestra 21; esta diferencia se destaca como un problema de conciliación y atribución.</desc>
