    text{font-family:Arial,Helvetica,sans-serif;fill:#26352f}.title{font-size:23px;font-weight:700}.sub{font-size:14px;fill:#596962}.label{font-size:14px}.tick{font-size:12px;fill:#596962}.value{font-size:14px;font-weight:700}.grid{stroke:#dce5df;stroke-width:1}.axis{stroke:#82948a;stroke-width:1.2}.named{fill:#23845c}.unset{fill:#e47f24}.channel{fill:#98a6a0}
  </style>
